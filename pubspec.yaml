name: pink_data_mobile
description: "CreatorLens mobile: share reels from Instagram straight into your staging queue."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  receive_sharing_intent: ^1.6.5
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E1E1E" # Matches your dark background
  adaptive_icon_foreground: "assets/icon/app_icon.png"